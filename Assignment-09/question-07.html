<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Landing Page Header</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero-content {
            max-width: 800px;
            padding: 20px;
        }
        .hero-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .hero-description {
            font-size: 1.25rem;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Welcome to Our Platform</h1>
            <p class="hero-description">We provide the best solutions for your business. Join us today and experience growth like never before.</p>
            <a href="#" class="btn btn-primary btn-lg px-5 py-3">Get Started Now</a>
        </div>
    </header>
</body>
</html>
