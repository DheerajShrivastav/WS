<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px 0;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="text-center mt-5">My Gallery</h2>
        <div class="gallery-grid">
            <div class="gallery-item"><img
                    src="https://res.cloudinary.com/duw1ypdeg/image/upload/v1701348168/usjnw4zdcjodomyazkjf.png"
                    alt="Gallery"></div>
            <div class="gallery-item"><img
                    src="https://res.cloudinary.com/duw1ypdeg/image/upload/c_thumb,w_200,g_face/v1701348168/usjnw4zdcjodomyazkjf.png"
                    alt="Gallery"></div>
            <div class="gallery-item"><img
                    src="https://res.cloudinary.com/duw1ypdeg/image/upload/c_thumb,w_200,g_face/v1701348168/usjnw4zdcjodomyazkjf.png"
                    alt="Gallery"></div>
            <div class="gallery-item"><img
                    src="https://res.cloudinary.com/duw1ypdeg/image/upload/c_thumb,w_200,g_face/v1701348168/usjnw4zdcjodomyazkjf.png"
                    alt="Gallery"></div>
            <div class="gallery-item"><img
                    src="https://res.cloudinary.com/duw1ypdeg/image/upload/c_thumb,w_200,g_face/v1701348168/usjnw4zdcjodomyazkjf.png"
                    alt="Gallery"></div>
            <div class="gallery-item"><img
                    src="https://res.cloudinary.com/duw1ypdeg/image/upload/c_thumb,w_200,g_face/v1701348168/usjnw4zdcjodomyazkjf.png"
                    alt="Gallery"></div>
        </div>
    </div>
</body>

</html>
