<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            max-width: 300px;
            margin: 50px auto;
            border-radius: 8px;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .product-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transform: translateY(-5px);
        }
        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">
    <div class="card product-card text-center bg-white">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=400" class="product-img" alt="Product Image">
        <div class="card-body">
            <h5 class="card-title fw-bold">Wireless Headphones</h5>
            <p class="card-text text-danger fw-bold fs-4">$99.99</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
        </div>
    </div>
</body>
</html>
