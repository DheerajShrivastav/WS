<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .testimonial-card {
            max-width: 600px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        .customer-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #0d6efd;
        }

        .stars {
            color: #ffc107;
            font-size: 24px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="text-center mt-5">What Our Customers Say</h2>
        <div class="testimonial-card bg-white">
            <img src="https://res.cloudinary.com/duw1ypdeg/image/upload/c_thumb,w_200,g_face/v1701348168/usjnw4zdcjodomyazkjf.png"
                alt="Customer Image" class="customer-img">
            <div class="stars">&#9733; &#9733; &#9733; &#9733; &#9733;</div>
            <p class="fst-italic fs-5 mb-4">"This service is absolutely incredible! It has completely transformed the
                way we do business. Highly recommended!"</p>
            <h5 class="fw-bold mb-0">Jane Smith</h5>
            <small class="text-muted">CEO, Tech Innovations</small>
        </div>
    </div>
</body>

</html>
