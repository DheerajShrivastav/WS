<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pricing Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pricing-section {
            padding: 50px 0;
        }
        .pricing-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        .pricing-card.highlight {
            border: 2px solid #0d6efd;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: scale(1.05);
        }
        .pricing-card.highlight:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container pricing-section">
        <h2 class="text-center mb-5">Choose Your Plan</h2>
        <div class="row g-4 justify-content-center">
            <!-- Basic Plan -->
            <div class="col-md-4">
                <div class="card pricing-card text-center h-100">
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title">Basic</h4>
                        <h2 class="my-4">$10<small class="text-muted fs-6">/mo</small></h2>
                        <ul class="list-unstyled flex-grow-1">
                            <li>1 User</li>
                            <li>10 Projects</li>
                            <li>Basic Support</li>
                        </ul>
                        <button class="btn btn-outline-primary mt-auto">Sign Up</button>
                    </div>
                </div>
            </div>
            <!-- Standard Plan (Highlighted) -->
            <div class="col-md-4">
                <div class="card pricing-card highlight text-center h-100">
                    <div class="card-header bg-primary text-white">Most Popular</div>
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title">Standard</h4>
                        <h2 class="my-4">$20<small class="text-muted fs-6">/mo</small></h2>
                        <ul class="list-unstyled flex-grow-1">
                            <li>5 Users</li>
                            <li>50 Projects</li>
                            <li>Priority Support</li>
                        </ul>
                        <button class="btn btn-primary mt-auto">Sign Up</button>
                    </div>
                </div>
            </div>
            <!-- Premium Plan -->
            <div class="col-md-4">
                <div class="card pricing-card text-center h-100">
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title">Premium</h4>
                        <h2 class="my-4">$30<small class="text-muted fs-6">/mo</small></h2>
                        <ul class="list-unstyled flex-grow-1">
                            <li>Unlimited Users</li>
                            <li>Unlimited Projects</li>
                            <li>24/7 Support</li>
                        </ul>
                        <button class="btn btn-outline-primary mt-auto">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
