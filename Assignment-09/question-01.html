<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Design</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-card {
            max-width: 350px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: box-shadow 0.3s ease;
        }
        .profile-card:hover {
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-top: 20px;
        }
        .social-icons a {
            font-size: 24px;
            margin: 0 10px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="card profile-card text-center">
        <img src="https://via.placeholder.com/150" alt="Profile Image" class="profile-img mx-auto">
        <div class="card-body">
            <h4 class="card-title">John Doe</h4>
            <p class="card-text text-muted">Web Developer passionate about building great UI/UX designs.</p>
            <div class="social-icons mb-3">
                <a href="#">&#128247;</a> <!-- Camera -->
                <a href="#">&#128038;</a> <!-- Bird -->
                <a href="#">&#128187;</a> <!-- PC -->
            </div>
        </div>
    </div>
</body>
</html>
