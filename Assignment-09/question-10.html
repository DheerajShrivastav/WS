<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .footer {
            background-color: #343a40;
            color: #f8f9fa;
            padding: 60px 0 20px;
        }

        .footer h5 {
            color: #fff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .footer a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #fff;
        }

        .social-icons a {
            display: inline-block;
            margin-right: 15px;
            font-size: 1.2rem;
            color: #fff;
        }

        .footer-bottom {
            margin-top: 40px;
            border-top: 1px solid #555;
            padding-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #bbb;
        }
    </style>
</head>

<body>
    <div style="min-height: 50vh;" class="d-flex align-items-center justify-content-center">
        <h2>Scroll down to see the footer</h2>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <h5>About Us</h5>
                    <p class="">We provide the best web solutions. Our focus is on quality, performance, and
                        user-centered design.</p>
                </div>
                <div class="col-md-4 mb-4">
                    <h5>Quick Links</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="#">Home</a></li>
                        <li class="mb-2"><a href="#">Our Services</a></li>
                        <li class="mb-2"><a href="#">Portfolio</a></li>
                        <li class="mb-2"><a href="#">Contact Us</a></li>
                    </ul>
                </div>
                <div class="col-md-4 mb-4">
                    <h5>Follow Us</h5>
                    <div class="social-icons">
                        <a href="#">FB</a>
                        <a href="#">TW</a>
                        <a href="#">IG</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                &copy; 2026 Your Company Name. All Rights Reserved.
            </div>
        </div>
    </footer>
</body>

</html>
