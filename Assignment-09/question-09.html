<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .skills-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .progress {
            height: 25px;
            margin-bottom: 25px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        .progress-bar {
            animation: fillBar 1.5s ease-in-out;
        }
        @keyframes fillBar {
            from { width: 0; }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="skills-container">
            <h3 class="text-center mb-4">My Skills</h3>
            
            <div class="mb-1 fw-bold">HTML</div>
            <div class="progress">
                <div class="progress-bar bg-danger" style="width: 80%">80%</div>
            </div>

            <div class="mb-1 fw-bold">CSS</div>
            <div class="progress">
                <div class="progress-bar bg-info" style="width: 70%">70%</div>
            </div>

            <div class="mb-1 fw-bold">JavaScript</div>
            <div class="progress">
                <div class="progress-bar bg-warning text-dark" style="width: 60%">60%</div>
            </div>
        </div>
    </div>
</body>
</html>
