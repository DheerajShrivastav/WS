<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0% {
                top: 0;
                left: 0;
            }
            25% {
                top: 100px;
                left: 100px;
            }
            50% {
                top: 200px;
                left: 200px;
            }
            75% {
                top: 100px;
                left: 100px;
            }
            100% {
                top: 0;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="ball" style="width: 50px; height: 50px; background-color: red; border-radius: 50%; position: absolute; top: 0; left: 0;"></div>
    
</body>
</html>
