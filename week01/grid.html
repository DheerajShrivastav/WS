<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 10px;
        width: 400px;
        height: 400px;
    }

    .child {
        background-color: lightblue;
        border: 1px solid black;
        height: 100px;
        width: 100px;
    }

    .blogLayout {
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
        grid-template-rows: 1fr 5fr 1fr;
        gap: 10px;
        width: 100%;
        height: 100vh;
    }

    .header {
        background-color: lightcoral;
        grid-column: 1 / -1;
    }

    .sidebar {
        background-color: lightgreen;
    }

    .main {
        background-color: lightyellow;
    }

    .footer {
        background-color: lightpink;
        grid-column: 1 / -1;
    }
</style>

<body>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>

    </div>
    <div class="blogLayout">
        <div class="header"></div>
        <div class="sidebar"></div>
        <div class="main"></div>
        <div class="footer"></div>
    </div>

</body>

</html>
