<!DOCTYPE html>
<html lang="en">
    <style>
        /* Loading animation in circle*/
        /* make it simple circle shape not a any other shape */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .loading-plane {
            width: 50px;
            height: 50px;
            border: 5px solid #ccc;
            border-top: 5px solid #333;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

    </style>
    <body>
    <div class="loading-container">
        <div class="loading-plane">
            <div class="plane-body"></div>
            <div class="plane-wing-left"></div>
            <div class="plane-wing-right"></div>
            <div class="plane-tail"></div>

        </div>

    </div>
    </body>
    </html>
