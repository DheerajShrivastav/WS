<!DOCTYPE html>
<html>

<head>
    <title>Login Form - Question 11</title>
</head>

<body
    style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e9ecef; font-family: Arial, sans-serif; margin: 0;">
    <div
        style="background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px;">
        <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Welcome Back</h2>

        <form action="#" method="post">
            <div style="margin-bottom: 20px;">
                <label for="username" style="display: block; margin-bottom: 5px; color: #555;">Username</label>
                <input type="text" id="username" name="username" required
                    style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 25px;">
                <label for="password" style="display: block; margin-bottom: 5px; color: #555;">Password</label>
                <input type="password" id="password" name="password" required
                    style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
            </div>

            <button type="submit"
                style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">
                Login
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #777;">
            Don't have an account? <a href="#" style="color: #007bff; text-decoration: none;">Sign Up</a>
        </p>
    </div>
</body>

</html>
