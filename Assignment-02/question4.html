<!DOCTYPE html>
<html>

<head>
    <title>Contact Form - Question 4</title>
</head>

<body>
    <h1>Contact Us</h1>
    <p>Please fill out the form below to get in touch with us.</p>

    <form action="#" method="post"
        style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 400px; font-family: Arial, sans-serif;">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required
            style="width: 100%; margin-bottom: 10px; padding: 8px;">
        <br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required
            style="width: 100%; margin-bottom: 10px; padding: 8px;">
        <br>

        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" placeholder="Enter subject"
            style="width: 100%; margin-bottom: 10px; padding: 8px;">
        <br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" placeholder="Your message here..." required
            style="width: 100%; margin-bottom: 10px; padding: 8px;"></textarea>
        <br>

        <button type="submit"
            style="background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            Send Message
        </button>
    </form>
</body>

</html>
