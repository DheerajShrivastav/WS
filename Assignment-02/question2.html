<!DOCTYPE html>
<html>

<head>
    <title>Product Card - Question 2</title>
</head>

<body>
    <div style="border: 1px solid #ccc; width: 300px; padding: 20px; border-radius: 10px; font-family: sans-serif;">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" style="width: 100%; border-radius: 5px;">
        <h2>Wireless Headphones</h2>
        <p><strong>Price:</strong> $99.99</p>
        <p>High-quality wireless headphones with noise-canceling features and long battery life.</p>
        <button
            style="background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            Add to Cart
        </button>
    </div>
</body>

</html>
