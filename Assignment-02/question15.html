<!DOCTYPE html>
<html>

<head>
    <title>Footer - Question 15</title>
</head>

<body style="font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh;">
    ```html
    <style>
        .navbar {
            background-color: #333;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            position: relative;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ff9900;
        }

        .hamburger {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #333;
                text-align: center;
                padding: 1rem 0;
                z-index: 10;
            }

            .nav-links.active {
                display: flex;
            }

            .hamburger {
                display: block;
            }

            .nav-links li {
                padding: 10px 0;
            }
        }
    </style>

    <nav class="navbar">
        <div class="logo">MyLogo</div>
        <button class="hamburger" id="hamburger">&#9776;</button>
        <ul class="nav-links" id="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main style="flex: 1; padding: 2rem;">
        <h1>Responsive Navbar Example</h1>
        <p>Resize the window to see the hamburger menu on mobile devices.</p>
    </main>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
    ```

</body>

</html>
