<!DOCTYPE html>
<html>

<head>
    <title>Pricing Table - Question 14</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 50px; text-align: center;">
    <h1>Our Pricing Plans</h1>
    <p>Choose the plan that's right for you.</p>

    <div style="display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap;">
        <!-- Basic Plan -->
        <div
            style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px;">
            <h2 style="color: #555;">Basic</h2>
            <h1 style="font-size: 36px; margin: 10px 0;">$19<span style="font-size: 16px; color: #777;">/mo</span></h1>
            <ul style="list-style-type: none; padding: 0; margin: 20px 0; line-height: 2;">
                <li>5 Projects</li>
                <li>10GB Storage</li>
                <li>Email Support</li>
            </ul>
            <button
                style="width: 100%; padding: 12px; background-color: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">Select
                Plan</button>
        </div>

        <!-- Pro Plan -->
        <div
            style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); width: 250px; border: 2px solid #007bff; transform: scale(1.05);">
            <div
                style="background-color: #007bff; color: white; padding: 5px 0; border-radius: 5px 5px 0 0; margin: -30px -30px 20px; font-size: 12px; font-weight: bold;">
                MOST POPULAR</div>
            <h2 style="color: #007bff;">Pro</h2>
            <h1 style="font-size: 36px; margin: 10px 0;">$49<span style="font-size: 16px; color: #777;">/mo</span></h1>
            <ul style="list-style-type: none; padding: 0; margin: 20px 0; line-height: 2;">
                <li>Unlimited Projects</li>
                <li>100GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <button
                style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Select
                Plan</button>
        </div>

        <!-- Enterprise Plan -->
        <div
            style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px;">
            <h2 style="color: #555;">Enterprise</h2>
            <h1 style="font-size: 36px; margin: 10px 0;">$99<span style="font-size: 16px; color: #777;">/mo</span></h1>
            <ul style="list-style-type: none; padding: 0; margin: 20px 0; line-height: 2;">
                <li>Dedicated Hosting</li>
                <li>1TB Storage</li>
                <li>24/7 Phone Support</li>
            </ul>
            <button
                style="width: 100%; padding: 12px; background-color: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">Select
                Plan</button>
        </div>
    </div>
</body>

</html>
