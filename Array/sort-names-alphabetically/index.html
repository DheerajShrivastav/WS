<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Names Alphabetically</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>5. Sort Names Alphabetically</h2>

    <div class="controls">
        <input type="text" id="nameInput" placeholder="Enter a name">
        <button class="btn add" onclick="addName()">Add Name</button>
        <button class="btn sort" onclick="sortNames()">Sort</button>
        <button class="btn reset" onclick="resetNames()">Reset</button>
    </div>

    <div id="namesList" class="names-list"></div>

    <script src="script.js"></script>
</body>
</html>
