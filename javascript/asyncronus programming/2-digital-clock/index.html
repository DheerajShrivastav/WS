<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #eef3ff;
        }

        .clock-box {
            background: #111827;
            color: #22c55e;
            font-size: clamp(28px, 6vw, 52px);
            letter-spacing: 2px;
            padding: 24px 36px;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            min-width: 280px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="clock-box" id="clock">00:00:00</div>

    <script src="script.js"></script>
</body>

</html>
