<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
        }

        .slider {
            width: min(90vw, 500px);
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        #slideImage {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            background: #1f6feb;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1859bc;
        }
    </style>
</head>

<body>
    <div class="slider">
        <img id="slideImage" src="" alt="slider image" />
        <div class="controls">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
